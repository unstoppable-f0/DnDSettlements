services:
  backend:
    build: .
    container_name: backend-hades
    ports:
      - "8000:8000"
    networks:
      - astral_sea

  frontend:
    container_name: frontend-elysium
    build: ./frontend
    depends_on:
      - backend
    networks:
      - astral_sea

  nginx:
    image: nginx:alpine
    ports:
      - "81:81"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - astral_sea

networks:
  astral_sea:
    driver: bridge
