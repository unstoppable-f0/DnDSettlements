services:
  backend:
    build: .
    container_name: backend-hades
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
        db:
          condition: service_healthy
    networks:
      - astral_sea

  frontend:
    container_name: frontend-elysium
    build: ./frontend
    depends_on:
      - backend
    networks:
      - astral_sea

  db:
    image: postgres:18.6-trixie
    container_name: db-mechanus
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
          interval: 5s
          timeout: 3s
          retries: 10
    networks:
      - astral_sea


  nginx:
    image: nginx:alpine
    ports:
      - "81:81"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - astral_sea

volumes:
  pg_data:

networks:
  astral_sea:
    driver: bridge
